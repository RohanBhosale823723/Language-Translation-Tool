<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translation Tool</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>🌐 Language Translation Tool</h1>
        <p class="subtitle">Translate text easily from one language to another</p>

        <div class="translation-box">

            <div class="language-section">
                <div>
                    <label for="sourceLanguage">Source Language</label>
                    <select id="sourceLanguage">
                        <option value="en">English</option>
                        <option value="mr">Marathi</option>
                        <option value="hi">Hindi</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                    </select>
                </div>

                <div>
                    <label for="targetLanguage">Target Language</label>
                    <select id="targetLanguage">
                        <option value="mr">Marathi</option>
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                    </select>
                </div>
            </div>

            <label for="inputText">Enter Text</label>
            <textarea id="inputText" placeholder="Type your text here..."></textarea>

            <button onclick="translateText()">Translate</button>

            <label for="outputText">Translated Text</label>
            <textarea id="outputText" placeholder="Translation will appear here..." readonly></textarea>

            <button class="copy-btn" onclick="copyText()">📋 Copy Translation</button>

        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
